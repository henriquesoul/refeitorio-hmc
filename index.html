<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no">

  <meta name="theme-color" content="#063b75">

  <title>Controle de Refeitório HMC</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7fb;
      color: #17345c;
    }

    body {
      height: 100dvh;
    }

    .app {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* =========================
       CABEÇALHO
       ========================= */

    .topo {
      flex: 0 0 auto;
      background: linear-gradient(
        135deg,
        #063b75,
        #005aa7
      );

      color: white;
      text-align: center;

      padding:
        clamp(10px, 2vh, 18px)
        12px
        clamp(10px, 2vh, 16px);
    }

    .hmc {
      font-size:
        clamp(28px, 7vw, 42px);

      font-weight: 900;
      letter-spacing: 2px;
      line-height: 1;
    }

    .hospital {
      margin-top: 5px;

      font-size:
        clamp(9px, 2.4vw, 13px);

      font-weight: 600;

      line-height: 1.2;
    }

    .titulo {
      margin-top:
        clamp(8px, 1.8vh, 14px);

      font-size:
        clamp(16px, 4.5vw, 22px);

      font-weight: 800;

      line-height: 1.1;
    }


    /* =========================
       CONTEÚDO PRINCIPAL
       ========================= */

    .conteudo {
      flex: 1 1 auto;

      min-height: 0;

      display: flex;
      flex-direction: column;
      align-items: center;

      padding:
        clamp(8px, 1.5vh, 14px)
        14px
        clamp(8px, 1.5vh, 12px);

      overflow: hidden;
    }

    .instrucao-area {
      flex: 0 0 auto;
      text-align: center;
    }

    .icone {
      font-size:
        clamp(24px, 6vw, 36px);

      line-height: 1;
      margin-bottom: 5px;
    }

    .instrucao {
      font-size:
        clamp(19px, 5vw, 28px);

      line-height: 1.05;

      font-weight: 900;

      color: #073f7d;
    }

    .subinstrucao {
      margin-top: 4px;

      font-size:
        clamp(14px, 3.8vw, 18px);

      color: #555;
    }


    /* =========================
       ÁREA DA CÂMERA
       ========================= */

    .camera-card {
      flex: 1 1 auto;

      min-height: 0;

      width:
        min(94vw, 480px);

      margin-top:
        clamp(8px, 1.5vh, 14px);

      background: white;

      border-radius:
        clamp(14px, 4vw, 22px);

      padding:
        clamp(7px, 1.5vw, 12px);

      box-shadow:
        0 6px 24px rgba(0, 0, 0, 0.10);

      display: flex;
      flex-direction: column;
    }

    .camera {
      position: relative;

      flex: 1 1 auto;

      min-height: 0;

      width: 100%;

      background: #111;

      border-radius:
        clamp(10px, 3vw, 16px);

      overflow: hidden;
    }

    video {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: cover;

      background: #111;
    }

    .mira {
      position: absolute;

      top: 12%;
      bottom: 12%;
      left: 12%;
      right: 12%;

      border:
        clamp(3px, 0.7vw, 4px)
        solid
        #0d72cc;

      border-radius:
        clamp(12px, 4vw, 20px);

      pointer-events: none;

      box-shadow:
        0 0 0 1px
        rgba(255, 255, 255, 0.10);
    }

    .status-camera {
      flex: 0 0 auto;

      margin-top: 7px;

      padding: 2px 4px;

      font-size:
        clamp(11px, 2.8vw, 14px);

      line-height: 1.2;

      text-align: center;

      color: #667085;
    }


    /* =========================
       BOTÕES
       ========================= */

    .botoes {
      flex: 0 0 auto;

      width:
        min(94vw, 480px);

      margin-top:
        clamp(7px, 1.3vh, 12px);

      display: flex;

      gap: 8px;

      justify-content: center;
    }

    .botao {
      flex: 1;

      min-height: 44px;

      padding:
        10px 12px;

      border: none;

      border-radius: 11px;

      background: #07549a;

      color: white;

      font-size:
        clamp(12px, 3.3vw, 15px);

      font-weight: 800;

      cursor: pointer;

      touch-action: manipulation;
    }

    .botao:active {
      transform: scale(0.98);
    }

    .botao-secundario {
      background: #e8f2ff;

      color: #07549a;

      border: 2px solid #07549a;
    }


    /* =========================
       RODAPÉ
       ========================= */

    .rodape {
      flex: 0 0 auto;

      background: #063b75;

      color: white;

      text-align: center;

      padding:
        clamp(7px, 1.3vh, 11px)
        8px;

      font-size:
        clamp(9px, 2.5vw, 12px);

      line-height: 1.25;
    }


    /* =========================
       TELAS MUITO BAIXAS
       ========================= */

    @media (max-height: 650px) {

      .hospital {
        display: none;
      }

      .titulo {
        margin-top: 5px;
      }

      .icone {
        display: none;
      }

      .subinstrucao {
        display: none;
      }

      .camera-card {
        margin-top: 6px;
      }

      .botoes {
        margin-top: 5px;
      }

    }


    /* =========================
       TELAS MAIS LARGAS
       ========================= */

    @media (min-width: 700px) {

      .camera-card {
        width: min(58vw, 520px);
      }

      .botoes {
        width: min(58vw, 520px);
      }

    }

  </style>
</head>

<body>

  <div class="app">

    <header class="topo">

      <div class="hmc">
        HMC
      </div>

      <div class="hospital">
        Hospital Municipal Gov. Mário Covas Júnior
      </div>

      <div class="titulo">
        CONTROLE DE REFEITÓRIO
      </div>

    </header>


    <main class="conteudo">

      <div class="instrucao-area">

        <div class="icone">
          🍴
        </div>

        <div class="instrucao">
          APONTE O QR CODE
        </div>

        <div class="subinstrucao">
          para a câmera
        </div>

      </div>


      <div class="camera-card">

        <div class="camera">

          <video
            id="video"
            autoplay
            muted
            playsinline>
          </video>

          <div class="mira"></div>

        </div>


        <div
          class="status-camera"
          id="statusCamera">

          Clique em "Ativar câmera".

        </div>

      </div>


      <div class="botoes">

        <button
          class="botao"
          id="btnCamera"
          onclick="iniciarCamera()">

          ATIVAR CÂMERA

        </button>


        <button
          class="botao botao-secundario"
          id="btnTrocar"
          onclick="trocarCamera()"
          style="display:none;">

          ↻ TROCAR CÂMERA

        </button>

      </div>

    </main>


    <footer class="rodape">

      HMC • Controle de Refeitório
      <br>

      Mantenha este equipamento conectado à energia

    </footer>

  </div>


  <script>

    let streamCamera = null;

    let cameraAtual =
      "environment";


    async function iniciarCamera() {

      const status =
        document.getElementById(
          "statusCamera"
        );

      const btnCamera =
        document.getElementById(
          "btnCamera"
        );

      const btnTrocar =
        document.getElementById(
          "btnTrocar"
        );


      status.innerText =
        "Solicitando acesso à câmera...";


      try {

        if (
          !navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia
        ) {

          throw new Error(
            "Este navegador não oferece suporte à câmera."
          );

        }


        pararCamera();


        streamCamera =
          await navigator.mediaDevices
            .getUserMedia({

              video: {

                facingMode: {
                  ideal: cameraAtual
                },

                width: {
                  ideal: 1280
                },

                height: {
                  ideal: 720
                }

              },

              audio: false

            });


        const video =
          document.getElementById(
            "video"
          );


        video.srcObject =
          streamCamera;


        await video.play();


        if (
          cameraAtual ===
          "environment"
        ) {

          status.innerText =
            "Câmera traseira pronta. Aguardando QR Code.";

        }

        else {

          status.innerText =
            "Câmera frontal pronta. Aguardando QR Code.";

        }


        btnCamera.style.display =
          "none";


        btnTrocar.style.display =
          "block";

      }


      catch (erro) {

        console.error(
          erro
        );


        status.innerText =
          "Erro da câmera: " +
          erro.name +
          " - " +
          erro.message;


        btnCamera.style.display =
          "block";

      }

    }


    function pararCamera() {

      if (
        streamCamera
      ) {

        streamCamera
          .getTracks()
          .forEach(
            function(track) {

              track.stop();

            }
          );


        streamCamera =
          null;

      }

    }


    async function trocarCamera() {

      const status =
        document.getElementById(
          "statusCamera"
        );


      status.innerText =
        "Trocando câmera...";


      if (
        cameraAtual ===
        "environment"
      ) {

        cameraAtual =
          "user";

      }

      else {

        cameraAtual =
          "environment";

      }


      await iniciarCamera();

    }


    window.addEventListener(
      "beforeunload",
      function() {

        pararCamera();

      }
    );

  </script>

</body>
</html>
