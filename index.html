<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no">

  <meta
    name="theme-color"
    content="#063b75">

  <title>
    Controle de Refeitório HMC
  </title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f4f7fb;

      color: #17345c;

    }


    body {
      height: 100dvh;
    }


    .app {

      width: 100%;
      height: 100dvh;

      display: flex;
      flex-direction: column;

      overflow: hidden;

    }


    /* ==============================
       CABEÇALHO
       ============================== */

    .topo {

      flex: 0 0 auto;

      background:
        linear-gradient(
          135deg,
          #063b75,
          #005aa7
        );

      color: white;

      text-align: center;

      padding:
        clamp(10px, 2vh, 18px)
        12px
        clamp(10px, 2vh, 16px);

    }


    .hmc {

      font-size:
        clamp(28px, 7vw, 42px);

      font-weight: 900;

      letter-spacing: 2px;

      line-height: 1;

    }


    .hospital {

      margin-top: 5px;

      font-size:
        clamp(9px, 2.4vw, 13px);

      font-weight: 600;

      line-height: 1.2;

    }


    .titulo {

      margin-top:
        clamp(8px, 1.8vh, 14px);

      font-size:
        clamp(16px, 4.5vw, 22px);

      font-weight: 800;

      line-height: 1.1;

    }



    /* ==============================
       CONTEÚDO
       ============================== */

    .conteudo {

      flex: 1 1 auto;

      min-height: 0;

      display: flex;

      flex-direction: column;

      align-items: center;

      padding:
        clamp(8px, 1.5vh, 14px)
        14px
        clamp(8px, 1.5vh, 12px);

      overflow: hidden;

    }


    .instrucao-area {

      flex: 0 0 auto;

      text-align: center;

    }


    .icone {

      font-size:
        clamp(24px, 6vw, 36px);

      line-height: 1;

      margin-bottom: 5px;

    }


    .instrucao {

      font-size:
        clamp(19px, 5vw, 28px);

      line-height: 1.05;

      font-weight: 900;

      color: #073f7d;

    }


    .subinstrucao {

      margin-top: 4px;

      font-size:
        clamp(14px, 3.8vw, 18px);

      color: #555;

    }



    /* ==============================
       CÂMERA
       ============================== */

    .camera-card {

      flex: 1 1 auto;

      min-height: 0;

      width:
        min(94vw, 480px);

      margin-top:
        clamp(8px, 1.5vh, 14px);

      background: white;

      border-radius:
        clamp(14px, 4vw, 22px);

      padding:
        clamp(7px, 1.5vw, 12px);

      box-shadow:
        0 6px 24px
        rgba(0, 0, 0, 0.10);

      display: flex;

      flex-direction: column;

    }


    .camera {

      position: relative;

      flex: 1 1 auto;

      min-height: 0;

      width: 100%;

      background: #111;

      border-radius:
        clamp(10px, 3vw, 16px);

      overflow: hidden;

    }


    video {

      display: block;

      width: 100%;
      height: 100%;

      object-fit: cover;

      background: #111;

    }


    #canvas {

      display: none;

    }


    .mira {

      position: absolute;

      top: 12%;
      bottom: 12%;

      left: 12%;
      right: 12%;

      border:
        clamp(3px, 0.7vw, 4px)
        solid
        #0d72cc;

      border-radius:
        clamp(12px, 4vw, 20px);

      pointer-events: none;

      transition:
        border-color 0.2s,
        box-shadow 0.2s;

    }


    .mira.detectado {

      border-color: #16a34a;

      box-shadow:
        0 0 0 3px
        rgba(22, 163, 74, 0.20);

    }


    .status-camera {

      flex: 0 0 auto;

      margin-top: 7px;

      padding: 2px 4px;

      font-size:
        clamp(11px, 2.8vw, 14px);

      line-height: 1.2;

      text-align: center;

      color: #667085;

    }



    /* ==============================
       RESULTADO
       ============================== */

    .resultado {

      display: none;

      flex: 0 0 auto;

      margin-top: 7px;

      padding: 10px;

      background: #eaf7ee;

      color: #16833d;

      border:
        1px solid #b8dfc3;

      border-radius: 10px;

      text-align: center;

      font-size:
        clamp(12px, 3.2vw, 16px);

      line-height: 1.3;

      font-weight: 800;

      word-break: break-word;

    }


    .token {

      display: block;

      margin-top: 4px;

      font-size:
        clamp(18px, 5vw, 24px);

      font-weight: 900;

      color: #0d6f32;

      letter-spacing: 1px;

    }



    /* ==============================
       BOTÕES
       ============================== */

    .botoes {

      flex: 0 0 auto;

      width:
        min(94vw, 480px);

      margin-top:
        clamp(7px, 1.3vh, 12px);

      display: flex;

      gap: 8px;

      justify-content: center;

    }


    .botao {

      flex: 1;

      min-height: 44px;

      padding:
        10px 12px;

      border: none;

      border-radius: 11px;

      background: #07549a;

      color: white;

      font-size:
        clamp(12px, 3.3vw, 15px);

      font-weight: 800;

      cursor: pointer;

      touch-action: manipulation;

    }


    .botao:active {

      transform:
        scale(0.98);

    }


    .botao-secundario {

      background: #e8f2ff;

      color: #07549a;

      border:
        2px solid #07549a;

    }



    /* ==============================
       RODAPÉ
       ============================== */

    .rodape {

      flex: 0 0 auto;

      background: #063b75;

      color: white;

      text-align: center;

      padding:
        clamp(7px, 1.3vh, 11px)
        8px;

      font-size:
        clamp(9px, 2.5vw, 12px);

      line-height: 1.25;

    }



    @media (max-height: 650px) {

      .hospital {
        display: none;
      }

      .titulo {
        margin-top: 5px;
      }

      .icone {
        display: none;
      }

      .subinstrucao {
        display: none;
      }

      .camera-card {
        margin-top: 6px;
      }

      .botoes {
        margin-top: 5px;
      }

    }


    @media (min-width: 700px) {

      .camera-card {
        width:
          min(58vw, 520px);
      }

      .botoes {
        width:
          min(58vw, 520px);
      }

    }

  </style>

</head>



<body>


<div class="app">


  <header class="topo">

    <div class="hmc">
      HMC
    </div>


    <div class="hospital">
      Hospital Municipal Gov. Mário Covas Júnior
    </div>


    <div class="titulo">
      CONTROLE DE REFEITÓRIO
    </div>

  </header>



  <main class="conteudo">


    <div class="instrucao-area">

      <div class="icone">
        🍴
      </div>


      <div class="instrucao">
        APONTE O QR CODE
      </div>


      <div class="subinstrucao">
        para a câmera
      </div>

    </div>



    <div class="camera-card">


      <div class="camera">


        <video
          id="video"
          autoplay
          muted
          playsinline>
        </video>


        <canvas
          id="canvas">
        </canvas>


        <div
          class="mira"
          id="mira">
        </div>


      </div>



      <div
        class="status-camera"
        id="statusCamera">

        Clique em "Ativar câmera".

      </div>



      <div
        class="resultado"
        id="resultado">

      </div>


    </div>



    <div class="botoes">


      <button
        class="botao"
        id="btnCamera"
        onclick="iniciarCamera()">

        ATIVAR CÂMERA

      </button>



      <button
        class="botao botao-secundario"
        id="btnTrocar"
        onclick="trocarCamera()"
        style="display:none;">

        ↻ TROCAR CÂMERA

      </button>


    </div>


  </main>



  <footer class="rodape">

    HMC • Controle de Refeitório

    <br>

    Mantenha este equipamento conectado à energia

  </footer>


</div>



<script
  src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js">
</script>



<script>


/* ==============================
   VARIÁVEIS
   ============================== */


let streamCamera = null;


let cameraAtual =
  "environment";


let scannerLigado =
  false;


let processando =
  false;


let temporizadorScanner =
  null;


let ultimoCodigo =
  "";


let horarioUltimaLeitura =
  0;



const BLOQUEIO_MESMO_QR =
  4000;


const INTERVALO_SCANNER =
  120;


const LARGURA_ANALISE =
  720;



/* ==============================
   INICIAR CÂMERA
   ============================== */


async function iniciarCamera() {


  const status =
    document.getElementById(
      "statusCamera"
    );


  const btnCamera =
    document.getElementById(
      "btnCamera"
    );


  const btnTrocar =
    document.getElementById(
      "btnTrocar"
    );


  const resultado =
    document.getElementById(
      "resultado"
    );


  resultado.style.display =
    "none";


  status.innerText =
    "Solicitando acesso à câmera...";


  try {


    pararCamera();



    streamCamera =

      await navigator.mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              ideal: cameraAtual
            },

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }

          },

          audio: false

        });



    const video =
      document.getElementById(
        "video"
      );


    video.srcObject =
      streamCamera;


    await video.play();



    status.innerText =

      cameraAtual ===
      "environment"

        ?

      "Câmera traseira pronta. Aguardando QR Code."

        :

      "Câmera frontal pronta. Aguardando QR Code.";



    btnCamera.style.display =
      "none";


    btnTrocar.style.display =
      "block";


    scannerLigado =
      true;


    processando =
      false;


    iniciarScanner();


  }


  catch (erro) {


    console.error(
      erro
    );


    status.innerText =
      "Erro da câmera: " +
      erro.name +
      " - " +
      erro.message;


    btnCamera.style.display =
      "block";


  }


}



/* ==============================
   SCANNER
   ============================== */


function iniciarScanner() {


  cancelarScanner();


  scannerLigado =
    true;


  executarScanner();


}



function executarScanner() {


  if (
    !scannerLigado
  ) {

    return;

  }



  tentarLerQRCode();



  temporizadorScanner =

    setTimeout(

      executarScanner,

      INTERVALO_SCANNER

    );


}



/* ==============================
   LER QR CODE
   ============================== */


function tentarLerQRCode() {


  if (
    processando
  ) {

    return;

  }



  if (
    typeof jsQR !==
    "function"
  ) {

    document
      .getElementById(
        "statusCamera"
      )
      .innerText =
        "Erro: leitor de QR Code não carregado.";

    return;

  }



  const video =
    document.getElementById(
      "video"
    );


  if (
    video.readyState <
    video.HAVE_ENOUGH_DATA
  ) {

    return;

  }



  const canvas =
    document.getElementById(
      "canvas"
    );


  const contexto =
    canvas.getContext(
      "2d",
      {
        willReadFrequently: true
      }
    );



  const larguraOriginal =
    video.videoWidth;


  const alturaOriginal =
    video.videoHeight;



  if (
    !larguraOriginal ||
    !alturaOriginal
  ) {

    return;

  }



  const largura =

    Math.min(
      larguraOriginal,
      LARGURA_ANALISE
    );



  const proporcao =

    largura /
    larguraOriginal;



  const altura =

    Math.round(
      alturaOriginal *
      proporcao
    );



  canvas.width =
    largura;


  canvas.height =
    altura;



  contexto.drawImage(

    video,

    0,
    0,

    largura,
    altura

  );



  const imagem =

    contexto.getImageData(

      0,
      0,

      largura,
      altura

    );



  let codigo = null;



  try {


    codigo =

      jsQR(

        imagem.data,

        imagem.width,

        imagem.height,

        {

          inversionAttempts:
            "attemptBoth"

        }

      );


  }


  catch (erro) {


    console.error(
      erro
    );


    return;


  }



  if (
    codigo &&
    codigo.data
  ) {


    const valor =

      codigo.data.trim();



    if (
      !valor
    ) {

      return;

    }



    const agora =
      Date.now();



    if (

      valor ===
      ultimoCodigo &&

      agora -
      horarioUltimaLeitura
      <
      BLOQUEIO_MESMO_QR

    ) {

      return;

    }



    ultimoCodigo =
      valor;


    horarioUltimaLeitura =
      agora;



    qrDetectado(
      valor
    );


  }


}



/* ==============================
   EXTRAIR TOKEN
   ============================== */


function extrairToken(
  conteudoQR
) {


  /*
    CASO 1
    QR já contém somente HMC0001
  */


  if (
    /^HMC\d+$/i.test(
      conteudoQR
    )
  ) {

    return conteudoQR
      .toUpperCase();

  }



  /*
    CASO 2
    QR contém URL com ?token=
  */


  try {


    const url =
      new URL(
        conteudoQR
      );


    const token =
      url.searchParams.get(
        "token"
      );


    if (
      token
    ) {

      return token
        .trim()
        .toUpperCase();

    }


  }


  catch (erro) {

    /*
      Não era uma URL válida.
      Seguimos para próxima tentativa.
    */

  }



  /*
    CASO 3
    Procura token dentro de qualquer texto.
  */


  const encontrado =

    conteudoQR.match(
      /HMC\d+/i
    );


  if (
    encontrado
  ) {

    return encontrado[0]
      .toUpperCase();

  }



  return null;


}



/* ==============================
   QR DETECTADO
   ============================== */


function qrDetectado(
  conteudoQR
) {


  processando =
    true;



  const status =
    document.getElementById(
      "statusCamera"
    );


  const resultado =
    document.getElementById(
      "resultado"
    );


  const mira =
    document.getElementById(
      "mira"
    );



  const token =
    extrairToken(
      conteudoQR
    );



  mira.classList.add(
    "detectado"
  );



  if (
    token
  ) {


    status.innerText =
      "QR Code identificado!";


    resultado.innerHTML =

      "TOKEN IDENTIFICADO:" +

      "<span class='token'>" +

      token +

      "</span>";


    resultado.style.display =
      "block";


    /*
      Ainda não envia para
      o Apps Script.

      Essa será a próxima etapa.
    */


  }


  else {


    status.innerText =
      "QR Code inválido.";


    resultado.innerHTML =

      "Não foi possível identificar um token HMC neste QR Code.";


    resultado.style.display =
      "block";


  }



  setTimeout(

    function() {


      resultado.style.display =
        "none";


      mira.classList.remove(
        "detectado"
      );


      status.innerText =

        cameraAtual ===
        "environment"

          ?

        "Câmera traseira pronta. Aguardando QR Code."

          :

        "Câmera frontal pronta. Aguardando QR Code.";



      processando =
        false;


    },

    3000

  );


}



/* ==============================
   TROCAR CÂMERA
   ============================== */


async function trocarCamera() {


  const status =
    document.getElementById(
      "statusCamera"
    );


  status.innerText =
    "Trocando câmera...";



  cameraAtual =

    cameraAtual ===
    "environment"

      ?

    "user"

      :

    "environment";



  ultimoCodigo =
    "";


  horarioUltimaLeitura =
    0;



  await iniciarCamera();


}



/* ==============================
   PARAR CÂMERA
   ============================== */


function pararCamera() {


  scannerLigado =
    false;


  cancelarScanner();



  if (
    streamCamera
  ) {


    streamCamera
      .getTracks()
      .forEach(

        function(track) {

          track.stop();

        }

      );


    streamCamera =
      null;


  }


}



/* ==============================
   CANCELAR SCANNER
   ============================== */


function cancelarScanner() {


  if (
    temporizadorScanner
  ) {


    clearTimeout(
      temporizadorScanner
    );


    temporizadorScanner =
      null;


  }


}



/* ==============================
   FECHAR PÁGINA
   ============================== */


window.addEventListener(

  "beforeunload",

  function() {

    pararCamera();

  }

);


</script>


</body>

</html>
