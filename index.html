<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no">

  <meta
    name="theme-color"
    content="#063b75">

  <title>Controle de Refeitório HMC</title>


  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f4f7fb;

      color: #17345c;
    }

    body {
      height: 100dvh;
    }

    .app {
      width: 100%;
      height: 100dvh;

      display: flex;
      flex-direction: column;

      overflow: hidden;
    }


    /* ==============================
       CABEÇALHO
       ============================== */

    .topo {
      flex: 0 0 auto;

      background:
        linear-gradient(
          135deg,
          #063b75,
          #005aa7
        );

      color: white;

      text-align: center;

      padding:
        clamp(10px, 2vh, 18px)
        12px
        clamp(10px, 2vh, 16px);
    }

    .hmc {
      font-size:
        clamp(28px, 7vw, 42px);

      font-weight: 900;
      letter-spacing: 2px;
      line-height: 1;
    }

    .hospital {
      margin-top: 5px;

      font-size:
        clamp(9px, 2.4vw, 13px);

      font-weight: 600;
      line-height: 1.2;
    }

    .titulo {
      margin-top:
        clamp(8px, 1.8vh, 14px);

      font-size:
        clamp(16px, 4.5vw, 22px);

      font-weight: 800;
      line-height: 1.1;
    }


    /* ==============================
       CONTEÚDO
       ============================== */

    .conteudo {
      flex: 1 1 auto;

      min-height: 0;

      display: flex;
      flex-direction: column;
      align-items: center;

      padding:
        clamp(8px, 1.5vh, 14px)
        14px
        clamp(8px, 1.5vh, 12px);

      overflow: hidden;
    }

    .instrucao-area {
      flex: 0 0 auto;
      text-align: center;
    }

    .icone {
      font-size:
        clamp(24px, 6vw, 36px);

      line-height: 1;

      margin-bottom: 5px;
    }

    .instrucao {
      font-size:
        clamp(19px, 5vw, 28px);

      line-height: 1.05;

      font-weight: 900;

      color: #073f7d;
    }

    .subinstrucao {
      margin-top: 4px;

      font-size:
        clamp(14px, 3.8vw, 18px);

      color: #555;
    }


    /* ==============================
       CÂMERA
       ============================== */

    .camera-card {
      flex: 1 1 auto;

      min-height: 0;

      width:
        min(94vw, 480px);

      margin-top:
        clamp(8px, 1.5vh, 14px);

      background: white;

      border-radius:
        clamp(14px, 4vw, 22px);

      padding:
        clamp(7px, 1.5vw, 12px);

      box-shadow:
        0 6px 24px
        rgba(0, 0, 0, 0.10);

      display: flex;
      flex-direction: column;
    }

    .camera {
      position: relative;

      flex: 1 1 auto;

      min-height: 0;

      width: 100%;

      background: #111;

      border-radius:
        clamp(10px, 3vw, 16px);

      overflow: hidden;
    }

    video {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: cover;

      background: #111;
    }

    #canvas {
      display: none;
    }

    .mira {
      position: absolute;

      top: 12%;
      bottom: 12%;
      left: 12%;
      right: 12%;

      border:
        clamp(3px, 0.7vw, 4px)
        solid
        #0d72cc;

      border-radius:
        clamp(12px, 4vw, 20px);

      pointer-events: none;

      transition:
        border-color .2s,
        box-shadow .2s;
    }

    .mira.detectado {
      border-color: #16a34a;

      box-shadow:
        0 0 0 3px
        rgba(22, 163, 74, .20);
    }

    .mira.erro {
      border-color: #b00020;
    }

    .mira.aviso {
      border-color: #d97706;
    }

    .status-camera {
      flex: 0 0 auto;

      margin-top: 7px;

      padding: 2px 4px;

      font-size:
        clamp(11px, 2.8vw, 14px);

      line-height: 1.2;

      text-align: center;

      color: #667085;
    }


    /* ==============================
       RESULTADO
       ============================== */

    .resultado {
      display: none;

      flex: 0 0 auto;

      margin-top: 7px;

      padding: 10px;

      border-radius: 10px;

      text-align: center;

      font-size:
        clamp(12px, 3.2vw, 16px);

      line-height: 1.3;

      font-weight: 800;

      word-break: break-word;
    }

    .resultado.processando {
      display: block;

      background: #e8f2ff;
      color: #07549a;
      border: 1px solid #9bc4eb;
    }

    .resultado.sucesso {
      display: block;

      background: #eaf7ee;
      color: #16833d;
      border: 1px solid #b8dfc3;
    }

    .resultado.aviso {
      display: block;

      background: #fff6e5;
      color: #a35c00;
      border: 1px solid #efc77e;
    }

    .resultado.erro {
      display: block;

      background: #fdecec;
      color: #a0001d;
      border: 1px solid #e8a9b2;
    }

    .resultado-titulo {
      display: block;

      font-size:
        clamp(17px, 4.5vw, 23px);

      font-weight: 900;

      margin-bottom: 5px;
    }

    .resultado-nome {
      display: block;

      font-size:
        clamp(17px, 4.5vw, 22px);

      font-weight: 900;
    }

    .resultado-detalhe {
      display: block;

      margin-top: 3px;

      font-size:
        clamp(11px, 3vw, 15px);

      font-weight: 700;
    }


    /* ==============================
       BOTÕES
       ============================== */

    .botoes {
      flex: 0 0 auto;

      width:
        min(94vw, 480px);

      margin-top:
        clamp(7px, 1.3vh, 12px);

      display: flex;

      gap: 8px;

      justify-content: center;
    }

    .botao {
      flex: 1;

      min-height: 44px;

      padding: 10px 12px;

      border: none;

      border-radius: 11px;

      background: #07549a;

      color: white;

      font-size:
        clamp(12px, 3.3vw, 15px);

      font-weight: 800;

      cursor: pointer;

      touch-action: manipulation;
    }

    .botao:active {
      transform: scale(.98);
    }

    .botao-secundario {
      background: #e8f2ff;

      color: #07549a;

      border: 2px solid #07549a;
    }


    /* ==============================
       RODAPÉ
       ============================== */

    .rodape {
      flex: 0 0 auto;

      background: #063b75;

      color: white;

      text-align: center;

      padding:
        clamp(7px, 1.3vh, 11px)
        8px;

      font-size:
        clamp(9px, 2.5vw, 12px);

      line-height: 1.25;
    }


    /* IFRAME DO APPS SCRIPT */

    #frameAppsScript {
      display: none;
      width: 0;
      height: 0;
      border: 0;
    }


    @media (max-height: 650px) {

      .hospital {
        display: none;
      }

      .titulo {
        margin-top: 5px;
      }

      .icone {
        display: none;
      }

      .subinstrucao {
        display: none;
      }

      .camera-card {
        margin-top: 6px;
      }

      .botoes {
        margin-top: 5px;
      }
    }


    @media (min-width: 700px) {

      .camera-card {
        width:
          min(58vw, 520px);
      }

      .botoes {
        width:
          min(58vw, 520px);
      }
    }

  </style>

</head>



<body>


<div class="app">


  <header class="topo">

    <div class="hmc">
      HMC
    </div>

    <div class="hospital">
      Hospital Municipal Gov. Mário Covas Júnior
    </div>

    <div class="titulo">
      CONTROLE DE REFEITÓRIO
    </div>

  </header>


  <main class="conteudo">


    <div class="instrucao-area">

      <div class="icone">
        🍴
      </div>

      <div class="instrucao">
        APONTE O QR CODE
      </div>

      <div class="subinstrucao">
        para a câmera
      </div>

    </div>


    <div class="camera-card">


      <div class="camera">

        <video
          id="video"
          autoplay
          muted
          playsinline>
        </video>

        <canvas id="canvas"></canvas>

        <div
          class="mira"
          id="mira">
        </div>

      </div>


      <div
        class="status-camera"
        id="statusCamera">

        Clique em "Ativar câmera".

      </div>


      <div
        class="resultado"
        id="resultado">
      </div>


    </div>


    <div class="botoes">

      <button
        class="botao"
        id="btnCamera"
        onclick="iniciarCamera()">

        ATIVAR CÂMERA

      </button>


      <button
        class="botao botao-secundario"
        id="btnTrocar"
        onclick="trocarCamera()"
        style="display:none;">

        ↻ TROCAR CÂMERA

      </button>

    </div>


    <iframe
      id="frameAppsScript"
      title="Comunicação com servidor">
    </iframe>


  </main>


  <footer class="rodape">

    HMC • Controle de Refeitório

    <br>

    Mantenha este equipamento conectado à energia

  </footer>


</div>



<script
  src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js">
</script>



<script>


/* ======================================================
   CONFIGURAÇÃO
   ====================================================== */


const URL_APPS_SCRIPT =
  "https://script.google.com/macros/s/AKfycbyYAOJ5c4ytDRmk8UmLBcYdK0b0dK9jVyevyiY2taf4RyC3G_46gVhx3LeTsFSQPiiE/exec";


const BLOQUEIO_MESMO_QR =
  10000;


const INTERVALO_SCANNER =
  120;


const LARGURA_ANALISE =
  720;


const TEMPO_RESULTADO =
  4000;


const TEMPO_LIMITE_SERVIDOR =
  12000;



/* ======================================================
   VARIÁVEIS
   ====================================================== */


let streamCamera = null;

let cameraAtual =
  "environment";

let scannerLigado =
  false;

let processando =
  false;

let temporizadorScanner =
  null;

let temporizadorServidor =
  null;

let ultimoCodigo =
  "";

let horarioUltimaLeitura =
  0;

let tokenEmProcessamento =
  "";



/* ======================================================
   INICIAR CÂMERA
   ====================================================== */


async function iniciarCamera() {


  const status =
    document.getElementById(
      "statusCamera"
    );


  const btnCamera =
    document.getElementById(
      "btnCamera"
    );


  const btnTrocar =
    document.getElementById(
      "btnTrocar"
    );


  limparResultado();


  status.innerText =
    "Solicitando acesso à câmera...";


  try {


    pararCamera();


    streamCamera =
      await navigator.mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              ideal: cameraAtual
            },

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }

          },

          audio: false

        });


    const video =
      document.getElementById(
        "video"
      );


    video.srcObject =
      streamCamera;


    await video.play();


    status.innerText =
      textoCameraPronta();


    btnCamera.style.display =
      "none";


    btnTrocar.style.display =
      "block";


    scannerLigado =
      true;


    processando =
      false;


    iniciarScanner();


  }


  catch (erro) {


    console.error(
      erro
    );


    status.innerText =
      "Erro da câmera: " +
      erro.name +
      " - " +
      erro.message;


    btnCamera.style.display =
      "block";


  }


}



/* ======================================================
   TEXTO CÂMERA
   ====================================================== */


function textoCameraPronta() {


  return cameraAtual ===
    "environment"

      ?

    "Câmera traseira pronta. Aguardando QR Code."

      :

    "Câmera frontal pronta. Aguardando QR Code.";


}



/* ======================================================
   SCANNER
   ====================================================== */


function iniciarScanner() {


  cancelarScanner();


  scannerLigado =
    true;


  executarScanner();


}



function executarScanner() {


  if (
    !scannerLigado
  ) {

    return;

  }


  tentarLerQRCode();


  temporizadorScanner =
    setTimeout(
      executarScanner,
      INTERVALO_SCANNER
    );


}



/* ======================================================
   LER QR CODE
   ====================================================== */


function tentarLerQRCode() {


  if (
    processando
  ) {

    return;

  }


  if (
    typeof jsQR !==
    "function"
  ) {

    document
      .getElementById(
        "statusCamera"
      )
      .innerText =
        "Erro: leitor de QR Code não carregado.";

    return;

  }


  const video =
    document.getElementById(
      "video"
    );


  if (
    video.readyState <
    video.HAVE_ENOUGH_DATA
  ) {

    return;

  }


  const canvas =
    document.getElementById(
      "canvas"
    );


  const contexto =
    canvas.getContext(
      "2d",
      {
        willReadFrequently: true
      }
    );


  const larguraOriginal =
    video.videoWidth;


  const alturaOriginal =
    video.videoHeight;


  if (
    !larguraOriginal ||
    !alturaOriginal
  ) {

    return;

  }


  const largura =
    Math.min(
      larguraOriginal,
      LARGURA_ANALISE
    );


  const proporcao =
    largura /
    larguraOriginal;


  const altura =
    Math.round(
      alturaOriginal *
      proporcao
    );


  canvas.width =
    largura;


  canvas.height =
    altura;


  contexto.drawImage(
    video,
    0,
    0,
    largura,
    altura
  );


  const imagem =
    contexto.getImageData(
      0,
      0,
      largura,
      altura
    );


  let codigo = null;


  try {


    codigo =
      jsQR(
        imagem.data,
        imagem.width,
        imagem.height,
        {
          inversionAttempts:
            "attemptBoth"
        }
      );


  }


  catch (erro) {


    console.error(
      erro
    );


    return;


  }


  if (
    codigo &&
    codigo.data
  ) {


    const valor =
      codigo.data.trim();


    if (
      !valor
    ) {

      return;

    }


    const agora =
      Date.now();


    if (

      valor ===
      ultimoCodigo &&

      agora -
      horarioUltimaLeitura
      <
      BLOQUEIO_MESMO_QR

    ) {

      return;

    }


    ultimoCodigo =
      valor;


    horarioUltimaLeitura =
      agora;


    qrDetectado(
      valor
    );


  }


}



/* ======================================================
   EXTRAIR TOKEN
   ====================================================== */


function extrairToken(
  conteudoQR
) {


  /*
    QR contendo apenas HMC0001
  */


  if (
    /^HMC\d+$/i.test(
      conteudoQR
    )
  ) {

    return conteudoQR
      .trim()
      .toUpperCase();

  }


  /*
    QR contendo URL ?token=HMC0001
  */


  try {


    const url =
      new URL(
        conteudoQR
      );


    const token =
      url.searchParams.get(
        "token"
      );


    if (
      token
    ) {

      return token
        .trim()
        .toUpperCase();

    }


  }


  catch (erro) {

    // Não era URL.

  }


  /*
    Procura HMC0001 em qualquer texto.
  */


  const encontrado =
    conteudoQR.match(
      /HMC\d+/i
    );


  if (
    encontrado
  ) {

    return encontrado[0]
      .toUpperCase();

  }


  return null;


}



/* ======================================================
   QR DETECTADO
   ====================================================== */


function qrDetectado(
  conteudoQR
) {


  processando =
    true;


  const token =
    extrairToken(
      conteudoQR
    );


  if (
    !token
  ) {


    mostrarErroLocal(
      "QR CODE INVÁLIDO",
      "Não foi possível identificar um token HMC."
    );


    return;

  }


  tokenEmProcessamento =
    token;


  const status =
    document.getElementById(
      "statusCamera"
    );


  const mira =
    document.getElementById(
      "mira"
    );


  mira.classList.remove(
    "erro",
    "aviso"
  );


  mira.classList.add(
    "detectado"
  );


  status.innerText =
    "QR Code identificado. Validando...";


  mostrarProcessando(
    token
  );


  enviarTokenAoServidor(
    token
  );


}



/* ======================================================
   ENVIAR TOKEN AO APPS SCRIPT
   ====================================================== */


function enviarTokenAoServidor(
  token
) {


  limparTemporizadorServidor();


  const frame =
    document.getElementById(
      "frameAppsScript"
    );


  /*
    nonce evita cache.
  */


  const url =
    URL_APPS_SCRIPT +

    "?token=" +

    encodeURIComponent(
      token
    ) +

    "&modo=totem" +

    "&nonce=" +

    Date.now();


  frame.src =
    url;


  temporizadorServidor =
    setTimeout(

      function() {


        mostrarErroLocal(
          "FALHA DE COMUNICAÇÃO",
          "O servidor não respondeu. Tente novamente."
        );


      },

      TEMPO_LIMITE_SERVIDOR

    );


}



/* ======================================================
   RECEBER RESPOSTA DO APPS SCRIPT
   ====================================================== */


window.addEventListener(

  "message",

  function(event) {


    /*
      Aceita somente mensagens
      originadas de serviços Google.
    */


    if (
      !origemGoogleValida(
        event.origin
      )
    ) {

      return;

    }


    const dados =
      event.data;


    if (
      !dados ||
      typeof dados !== "object"
    ) {

      return;

    }


    if (
      dados.fonte !==
      "HMC_REFEITORIO"
    ) {

      return;

    }


    /*
      Ignora uma resposta antiga.
    */


    if (
      tokenEmProcessamento &&
      dados.token &&
      String(
        dados.token
      ).toUpperCase() !==
      tokenEmProcessamento
    ) {

      return;

    }


    limparTemporizadorServidor();


    tratarRespostaServidor(
      dados
    );


  }

);



/* ======================================================
   VALIDAR ORIGEM GOOGLE
   ====================================================== */


function origemGoogleValida(
  origem
) {


  try {


    const url =
      new URL(
        origem
      );


    const host =
      url.hostname;


    return (

      host ===
        "script.google.com"

      ||

      host ===
        "script.googleusercontent.com"

      ||

      host.endsWith(
        ".googleusercontent.com"
      )

    );


  }


  catch (erro) {


    return false;


  }


}



/* ======================================================
   TRATAR RESPOSTA
   ====================================================== */


function tratarRespostaServidor(
  dados
) {


  const status =
    String(
      dados.status || ""
    );


  if (
    status === "SUCESSO"
  ) {


    mostrarResposta(
      dados,
      "sucesso"
    );


    return;

  }


  if (
    status === "DUPLICADO" ||
    status === "FORA_HORARIO"
  ) {


    mostrarResposta(
      dados,
      "aviso"
    );


    return;

  }


  mostrarResposta(
    dados,
    "erro"
  );


}



/* ======================================================
   MOSTRAR PROCESSANDO
   ====================================================== */


function mostrarProcessando(
  token
) {


  const resultado =
    document.getElementById(
      "resultado"
    );


  resultado.className =
    "resultado processando";


  resultado.innerHTML =

    "<span class='resultado-titulo'>" +
      "VALIDANDO..." +
    "</span>" +

    "<span class='resultado-detalhe'>" +
      token +
    "</span>";


}



/* ======================================================
   MOSTRAR RESPOSTA DO SERVIDOR
   ====================================================== */


function mostrarResposta(
  dados,
  tipo
) {


  const resultado =
    document.getElementById(
      "resultado"
    );


  const statusCamera =
    document.getElementById(
      "statusCamera"
    );


  const mira =
    document.getElementById(
      "mira"
    );


  mira.classList.remove(
    "detectado",
    "erro",
    "aviso"
  );


  if (
    tipo === "sucesso"
  ) {

    mira.classList.add(
      "detectado"
    );

  }


  if (
    tipo === "aviso"
  ) {

    mira.classList.add(
      "aviso"
    );

  }


  if (
    tipo === "erro"
  ) {

    mira.classList.add(
      "erro"
    );

  }


  resultado.className =
    "resultado " +
    tipo;


  let html =

    "<span class='resultado-titulo'>" +

      escaparHtml(
        dados.titulo || ""
      ) +

    "</span>";


  if (
    dados.nome
  ) {

    html +=

      "<span class='resultado-nome'>" +

        escaparHtml(
          dados.nome
        ) +

      "</span>";

  }


  if (
    dados.setor
  ) {

    html +=

      "<span class='resultado-detalhe'>" +

        escaparHtml(
          dados.setor
        ) +

      "</span>";

  }


  if (
    dados.refeicao
  ) {

    html +=

      "<span class='resultado-detalhe'>" +

        escaparHtml(
          dados.refeicao
        ) +

      "</span>";

  }


  if (
    dados.hora
  ) {

    html +=

      "<span class='resultado-detalhe'>" +

        escaparHtml(
          dados.hora
        ) +

      "</span>";

  }


  if (
    dados.mensagem &&
    dados.status !== "SUCESSO"
  ) {

    html +=

      "<span class='resultado-detalhe'>" +

        escaparHtml(
          dados.mensagem
        ) +

      "</span>";

  }


  resultado.innerHTML =
    html;


  statusCamera.innerText =
    dados.titulo ||
    "Resultado recebido.";


  setTimeout(

    voltarAoScanner,

    TEMPO_RESULTADO

  );


}



/* ======================================================
   ERRO LOCAL
   ====================================================== */


function mostrarErroLocal(
  titulo,
  mensagem
) {


  limparTemporizadorServidor();


  const resultado =
    document.getElementById(
      "resultado"
    );


  const status =
    document.getElementById(
      "statusCamera"
    );


  const mira =
    document.getElementById(
      "mira"
    );


  mira.classList.remove(
    "detectado",
    "aviso"
  );


  mira.classList.add(
    "erro"
  );


  resultado.className =
    "resultado erro";


  resultado.innerHTML =

    "<span class='resultado-titulo'>" +

      escaparHtml(
        titulo
      ) +

    "</span>" +

    "<span class='resultado-detalhe'>" +

      escaparHtml(
        mensagem
      ) +

    "</span>";


  status.innerText =
    titulo;


  setTimeout(

    voltarAoScanner,

    TEMPO_RESULTADO

  );


}



/* ======================================================
   VOLTAR AO PRÓXIMO COLABORADOR
   ====================================================== */


function voltarAoScanner() {


  limparResultado();


  const mira =
    document.getElementById(
      "mira"
    );


  const status =
    document.getElementById(
      "statusCamera"
    );


  mira.classList.remove(
    "detectado",
    "erro",
    "aviso"
  );


  status.innerText =
    textoCameraPronta();


  tokenEmProcessamento =
    "";


  processando =
    false;


}



/* ======================================================
   LIMPAR RESULTADO
   ====================================================== */


function limparResultado() {


  const resultado =
    document.getElementById(
      "resultado"
    );


  resultado.className =
    "resultado";


  resultado.innerHTML =
    "";


}



/* ======================================================
   TROCAR CÂMERA
   ====================================================== */


async function trocarCamera() {


  if (
    processando
  ) {

    return;

  }


  const status =
    document.getElementById(
      "statusCamera"
    );


  status.innerText =
    "Trocando câmera...";


  cameraAtual =
    cameraAtual ===
    "environment"

      ?

    "user"

      :

    "environment";


  ultimoCodigo =
    "";


  horarioUltimaLeitura =
    0;


  await iniciarCamera();


}



/* ======================================================
   PARAR CÂMERA
   ====================================================== */


function pararCamera() {


  scannerLigado =
    false;


  cancelarScanner();


  if (
    streamCamera
  ) {


    streamCamera
      .getTracks()
      .forEach(

        function(track) {

          track.stop();

        }

      );


    streamCamera =
      null;


  }


}



/* ======================================================
   CANCELAR SCANNER
   ====================================================== */


function cancelarScanner() {


  if (
    temporizadorScanner
  ) {


    clearTimeout(
      temporizadorScanner
    );


    temporizadorScanner =
      null;


  }


}



/* ======================================================
   TEMPORIZADOR DO SERVIDOR
   ====================================================== */


function limparTemporizadorServidor() {


  if (
    temporizadorServidor
  ) {


    clearTimeout(
      temporizadorServidor
    );


    temporizadorServidor =
      null;


  }


}



/* ======================================================
   SEGURANÇA DO TEXTO
   ====================================================== */


function escaparHtml(
  valor
) {


  return String(
    valor
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );


}



/* ======================================================
   FECHAR PÁGINA
   ====================================================== */


window.addEventListener(

  "beforeunload",

  function() {


    pararCamera();


    limparTemporizadorServidor();


  }

);


</script>
